name: Legal site quality

on:
  push:
    branches:
      - main
      - hardening/**
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: legal-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  legal-site-check:
    name: Legal site compliance checks
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Check validator syntax
        run: node --check scripts/validate-legal-site.cjs

      - name: Validate legal site
        run: node scripts/validate-legal-site.cjs
